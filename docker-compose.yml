services:
  app:
    container_name: love-memory
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./.env.production
    volumes:
      # SQLite database (bind mount, same as uploads)
      - ./data:/app/db
      # Photo uploads persistence
      - ./public/uploads:/app/public/uploads
      # System time
      - /etc/localtime:/etc/localtime:ro
