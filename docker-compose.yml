version: '3.8'

services:
  app:
    container_name: love-memory
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./.env.production
    volumes:
      # SQLite database (named volume for proper file locking)
      - db-data:/app/db
      # Photo uploads persistence (bind mount)
      - ./public/uploads:/app/public/uploads
      # Data directory for backups
      - ./data:/app/data
      # System time
      - /etc/localtime:/etc/localtime:ro

volumes:
  db-data:
